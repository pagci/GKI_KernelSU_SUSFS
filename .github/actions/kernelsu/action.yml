name: Setup SukiSU Ultra
description: Download and configure SukiSU Ultra (with in-tree SUSFS support + selinux-hide) via official setup.sh
inputs:
  use_latest_commits:
    description: 'Unused for SukiSU (kept for interface compatibility); SukiSU is pulled from susfs-main tip'
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Download SukiSU Ultra
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # Official SukiSU integration. The 'builtin' arg selects the SukiSU branch
        # whose kernel/Kconfig exposes the full CONFIG_KSU_SUSFS* menu and has the
        # manual hooks built in-tree (verified against ShirkNeko's own green builder).
        # NOTE: 'susfs-main'/'nongki' branches were removed upstream (404); 'builtin' is current.
        echo "Adding SukiSU Ultra (builtin)..."
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

        # setup.sh creates KernelSU/ at the kernel root and symlinks drivers/kernelsu.
        if [ ! -d KernelSU ]; then
          echo "ERROR: SukiSU setup did not create KernelSU/"; ls -la; exit 1
        fi
        echo "SukiSU tree:"; ls -la KernelSU

        # CRITICAL: setup.sh clones SukiSU shallow -> Kbuild's `git rev-list --count`
        # returns a low number -> wrong KSU_VERSION (e.g. 37971) -> manager (40796)
        # rejects it as incompatible ("Not installed"). Deepen to the full history so
        # KSU_VERSION = 40000 + real_commit_count - 2815 lands in the expected 40xxx range.
        git -C KernelSU fetch --unshallow 2>/dev/null || git -C KernelSU fetch --depth=2147483647 2>/dev/null || true
        echo "KernelSU commit count: $(git -C KernelSU rev-list --count HEAD 2>/dev/null)"

    - name: KSU stealth patches (selinux domain rename + trust my hidden-manager key)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        set -euo pipefail
        # Defeats juanma/kknd 'process:setcurrent' probe: it writes "u:r:ksu:s0" to
        # /proc/self/attr/current and a non-EINVAL result proves the 'ksu' type exists.
        # The type/domain name is a single #define in kernel/selinux/selinux.h; every
        # context string, sepolicy rule, transition and init.rc line derives from it,
        # so renaming the 2 defines renames everything coherently and root still works
        # (the renamed domain keeps all its allow rules). A probe for literal "ksu"
        # then hits security_context_to_sid failure -> EINVAL -> undetected.
        NEW_KSU_DOMAIN="${NEW_KSU_DOMAIN:-hmi_se}"
        NEW_KSU_FILE="${NEW_KSU_FILE:-${NEW_KSU_DOMAIN}_file}"
        SEL=kernel/selinux/selinux.h
        sed -i "s/#define KERNEL_SU_DOMAIN \"ksu\"/#define KERNEL_SU_DOMAIN \"${NEW_KSU_DOMAIN}\"/" "$SEL"
        sed -i "s/#define KERNEL_SU_FILE \"ksu_file\"/#define KERNEL_SU_FILE \"${NEW_KSU_FILE}\"/" "$SEL"
        echo "Renamed selinux defines:"; grep -E '#define KERNEL_SU_(DOMAIN|FILE)' "$SEL"
        # hard assert: the literal 'ksu' type must be gone from the defines
        if grep -qE '#define KERNEL_SU_(DOMAIN|FILE) "ksu' "$SEL"; then
          echo "ERROR: ksu SELinux rename did not apply"; exit 1
        fi

        # --- trust MY signing key so a renamed/resigned SukiSU manager is accepted ---
        # The kernel trusts a manager by the X.509 cert (size + sha256) in its v2 sig
        # block, NOT by package name (CVE-2023-49794 fix). apk_sign_keys[] is the trust
        # table. ADDITIVE: append my self-signed cert (computed + validated locally:
        # my parser reproduces the SukiSU row 0x35c/947ae9 exactly), keep upstream rows
        # (the official SukiSU manager stays as a no-rebuild recovery path).
        MY_SIZE="${MY_MANAGER_SIZE:-0x349}"
        MY_SHA="${MY_MANAGER_SHA:-56b24e1377a4523f52230f0480391bc4df2ea89b6d58b75f5597827f657aa876}"
        APKSIGN=kernel/manager/apk_sign.c
        sed -i "/apk_sign_keys\[\] = {/a\\    { ${MY_SIZE}, \"${MY_SHA}\" }, // self (trusted hidden manager)" "$APKSIGN"
        echo "apk_sign_keys[] now:"; grep -E '\{ 0x|\{ 384|// self' "$APKSIGN"
        if [ "$(grep -c "$MY_SHA" "$APKSIGN")" != "1" ]; then
          echo "ERROR: my manager key not inserted exactly once"; exit 1
        fi

        # --- gate the supercall fd-install to manager/root (defeat Duck run_ksu_supercall_probe) ---
        # A stock kernel returns EINVAL for this magic syscall. Without a gate, ANY caller
        # (incl. Duck's non-manager probe, which knows the open-source magics) reaches
        # ksu_supercall_reboot_handler -> task_work installs an fd into the caller = non-stock
        # behavior that crashes/fingerprints the probe (tombstone in run_ksu_supercall_probe).
        # Gate it so only manager/root proceed; everyone else gets stock -EINVAL.
        DISP=kernel/supercall/dispatch.c
        if [ -f "$DISP" ] && grep -q '    if (magic2 == KSU_INSTALL_MAGIC2)' "$DISP"; then
          sed -i 's|    if (magic2 == KSU_INSTALL_MAGIC2)|    if (!manager_or_root())\n        return -EINVAL;\n    if (magic2 == KSU_INSTALL_MAGIC2)|' "$DISP"
          if [ "$(grep -c '!manager_or_root' "$DISP")" != "1" ]; then
            echo "ERROR: supercall gate not applied exactly once"; exit 1
          fi
          echo "supercall fd-install gated to manager_or_root"
        else
          echo "ERROR: dispatch.c KSU_INSTALL_MAGIC2 routing not found (SukiSU layout changed)"; exit 1
        fi

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        # SukiSU computes its own version in Kbuild (40000 + commits - 2815).
        # Export best-effort env for downstream release-notes steps.
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "sukisu")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y