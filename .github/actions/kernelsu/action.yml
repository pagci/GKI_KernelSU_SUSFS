name: Setup SukiSU Ultra
description: Download and configure SukiSU Ultra (with in-tree SUSFS support + selinux-hide) via official setup.sh
inputs:
  use_latest_commits:
    description: 'Unused for SukiSU (kept for interface compatibility); SukiSU is pulled from susfs-main tip'
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Download SukiSU Ultra
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # Official SukiSU integration. The 'builtin' arg selects the SukiSU branch
        # whose kernel/Kconfig exposes the full CONFIG_KSU_SUSFS* menu and has the
        # manual hooks built in-tree (verified against ShirkNeko's own green builder).
        # NOTE: 'susfs-main'/'nongki' branches were removed upstream (404); 'builtin' is current.
        echo "Adding SukiSU Ultra (builtin)..."
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

        # setup.sh creates KernelSU/ at the kernel root and symlinks drivers/kernelsu.
        if [ ! -d KernelSU ]; then
          echo "ERROR: SukiSU setup did not create KernelSU/"; ls -la; exit 1
        fi
        echo "SukiSU tree:"; ls -la KernelSU

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        # SukiSU computes its own version in Kbuild (40000 + commits - 2815).
        # Export best-effort env for downstream release-notes steps.
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "sukisu")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y